<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script>
      window.addEventListener('DOMContentLoaded', async () => {
        const res = await fetch('/activities');
        const activities = await res.json();

        const list = document.getElementById('activities-list');
        const select = document.getElementById('activity');
        list.innerHTML = '';

        for (const [name, info] of Object.entries(activities)) {
          // Card
          const card = document.createElement('div');
          card.className = 'activity-card';
          card.innerHTML = `
            <h4>${name}</h4>
            <p>${info.description}</p>
            <p><strong>Schedule:</strong> ${info.schedule}</p>
            <p><strong>Spots:</strong> ${info.participants.length} / ${info.max_participants}</p>
          `;

          // Participants section
          const participantsHtml = info.participants && info.participants.length
            ? `<div class="participants">
                 <h5>Participants</h5>
                 <ul class="participants-list">
                   ${info.participants.map(p => `<li>${p}</li>`).join('')}
                 </ul>
               </div>`
            : `<div class="participants">
                 <h5>Participants</h5>
                 <p class="info">No participants yet</p>
               </div>`;

          card.innerHTML += participantsHtml;
          list.appendChild(card);

          // Option for select
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          select.appendChild(opt);
        }

        // Signup handling
        const form = document.getElementById('signup-form');
        const message = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          message.className = 'hidden';

          const email = document.getElementById('email').value.trim();
          const activity = document.getElementById('activity').value;

          if (!activity) {
            message.textContent = 'Please select an activity';
            message.className = 'message error';
            return;
          }

          try {
            const res2 = await fetch(`/activities/${encodeURIComponent(activity)}/signup?email=${encodeURIComponent(email)}`, {
              method: 'POST'
            });
            const data = await res2.json();

            if (res2.ok) {
              message.textContent = data.message;
              message.className = 'message success';
              // Update participants list in DOM
              const cards = document.querySelectorAll('.activity-card');
              cards.forEach(card => {
                if (card.querySelector('h4').textContent === activity) {
                  const ul = card.querySelector('.participants-list');
                  if (ul) {
                    const li = document.createElement('li');
                    li.textContent = email;
                    ul.appendChild(li);
                  } else {
                    // replace "No participants yet" with list
                    const partDiv = card.querySelector('.participants');
                    partDiv.innerHTML = `<h5>Participants</h5><ul class="participants-list"><li>${email}</li></ul>`;
                  }
                  // update spots line (simple approach)
                  const spotsP = Array.from(card.querySelectorAll('p')).find(p => p.textContent.startsWith('Spots:') || p.innerHTML.includes('Spots:'));
                  if (spotsP) {
                    const max = /\/\s*(\d+)/.exec(spotsP.textContent);
                    const current = card.querySelectorAll('.participants-list li').length;
                    if (max) spotsP.innerHTML = `<strong>Spots:</strong> ${current} / ${max[1]}`;
                  }
                }
              });
            } else {
              message.textContent = data.detail || 'Error signing up';
              message.className = 'message error';
            }
          } catch (err) {
            message.textContent = 'Network error';
            message.className = 'message error';
          }
        });
      });
    </script>
  </body>
</html>
